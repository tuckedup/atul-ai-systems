global: { scrape_interval: 5s }
scrape_configs:
  - job_name: routebench
    static_configs: [{ targets: ["host.docker.internal:8080"] }]   # /metrics from the gateway
  - job_name: vllm
    static_configs: [{ targets: ["vllm:8000"] }]
  - job_name: incident-demo
    static_configs: [{ targets: ["host.docker.internal:9000"] }]   # incident_commander/demo/service
