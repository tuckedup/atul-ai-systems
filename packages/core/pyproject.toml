[project]
name = "aisys-core"
version = "0.1.0"
description = "Shared primitives: llm, tracing, tools, approval, audit, evals"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27", "pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6",
  "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25",
  "mcp>=1.0", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.1", "redis>=5", "typer>=0.12", "rich>=13", "scikit-learn>=1.4",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]
[project.scripts]
aisys = "aisys.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisys"]
