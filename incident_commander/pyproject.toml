[project]
name = "incident-commander"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aisys-core", "forgecode", "langgraph>=1.0", "pyyaml>=6", "httpx>=0.27"]

[project.scripts]
ic = "incident_commander.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incident_commander"]

[tool.uv.sources]
aisys-core = { workspace = true }
forgecode = { workspace = true }

