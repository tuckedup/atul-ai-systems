[project]
name = "routebench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aisys-core",
  "fastapi>=0.115",
  "prometheus-client>=0.21",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "evalops"]

[tool.uv.sources]
aisys-core = { workspace = true }

