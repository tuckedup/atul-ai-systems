[project]
name = "routebench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aisys-core", "fastapi>=0.115", "httpx>=0.27", "uvicorn>=0.30"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
aisys-core = { path = "../packages/core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
