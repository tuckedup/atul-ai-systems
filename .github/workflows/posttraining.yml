name: posttraining-evidence
on:
  pull_request:
    paths: ['routebench/posttraining/**', '.github/workflows/posttraining.yml']
  push:
    paths: ['routebench/posttraining/**', '.github/workflows/posttraining.yml']
jobs:
  artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s routebench/posttraining -p 'test_*.py' -v
      # A valid scientific record can report a failed promotion gate.
      # This checks integrity; the default verify command still enforces quality.
      - run: python routebench/posttraining/experiment.py verify routebench/posttraining/evidence/seed42 --integrity-only
