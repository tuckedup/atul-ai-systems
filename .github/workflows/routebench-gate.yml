# Deterministic gate: no Docker, no provider key, no network. Everything here runs on the
# committed artifacts and fixtures.
#
# The previous version ran `python routebench/evalops/calibrate.py`, which read the synthetic
# self-agreement fixture and printed kappa 1.0. So CI's judge check was passing on a file whose
# human and judge columns were written from the same variable. It now validates the frozen
# calibration artifact instead, and asserts the negative cases too -- a gate that has never been
# seen to reject anything is not known to be a gate.
name: RouteBench eval gate

on:
  pull_request:
    paths:
      - "routebench/**"
      - "packages/core/**"
      - ".github/workflows/routebench-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No provider access in CI. Any test that needs a model must be skipped, not silently
      # exercised against a live endpoint.
      AISYS_OPENAI_API_KEY: ""
      AISYS_DATABASE_URL: "sqlite:///.local/aisys.db"
      AISYS_CACHE_BACKEND: "memory"
      PYTHONPATH: "routebench"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install locked workspace
        run: uv sync --frozen

      - name: Unit and integration tests
        run: uv run pytest packages/core/tests routebench/tests -q --basetemp .local/pytest-ci

      - name: Rubrics load and every rubric has a critical criterion
        run: |
          uv run python -c "
          from evalops import rubrics
          rs = rubrics.load_all()
          assert len(rs) >= 6, rs
          for name, r in rs.items():
              crit = [c.id for c in r.criteria if c.critical]
              assert len(crit) == 1, (name, crit)
          print('rubric bundle', rubrics.bundle_hash())
          "

      - name: Split integrity — no group or content leak across splits
        run: |
          uv run python -c "
          from evalops.dataset import Corpus
          from evalops.splits import SplitPlan, verify
          c = Corpus.load('routebench/evalops/data')
          print(verify(c.cases, SplitPlan.load('routebench/evalops/data/splits.json')))
          "

      - name: Corpus carries no fixture-provenance labels
        run: |
          uv run python -c "
          from evalops.dataset import Corpus, LabelProvenance
          c = Corpus.load('routebench/evalops/data')
          bad = [a.case_id for a in c.annotations if a.provenance is LabelProvenance.FIXTURE]
          assert not bad, f'fixture labels in the corpus: {bad[:5]}'
          print(c.label_summary())
          "

      - name: Experiment record is reproducible from this tree
        # Diagnostic, not blocking. `config_hash` covers the prompt scaffolding, so editing a
        # template after a dev run renames every judge in the record: the cached judgments stop
        # being findable and `freeze` fails with "0 paired items" while blaming the dev set. This
        # step names the drift instead. It is non-blocking because an unreproducible record is a
        # reason to re-judge, and the artifact validation below already fails the build.
        continue-on-error: true
        run: uv run python -m evalops.run_calibration verify

      - name: Combiner probe runs on the committed cache (no provider calls)
        run: |
          uv run python -m evalops.probe_combiners \
            --out .local/combiner_probe.json --markdown .local/COMBINER_PROBE.md

      - name: Checker adapters import and run with no torch, weights or network
        # The lazy-import contract. If a heavy import creeps above a loader function, the adapter
        # tests become undiscoverable on any machine without a GPU stack -- so CI asserts it here
        # as well as in the suite, where a conftest could mask it.
        run: |
          uv run python -c "
          import sys
          import evalops.checkers as c
          heavy = {'torch', 'transformers', 'nltk', 'vllm', 'minicheck', 'alignscore'}
          loaded = heavy & set(sys.modules)
          assert not loaded, f'heavy imports at module load: {loaded}'
          assert len(c.DEFAULT_SPECS) >= 4
          for spec in c.DEFAULT_SPECS:
              assert len(spec.upstream['commit']) == 40, spec.checker_id
              assert spec.model_name != 'Bespoke-MiniCheck-7B', 'licence-restricted default'
          print('checker adapters OK; upstream pins', sorted({s.upstream['commit'][:8] for s in c.DEFAULT_SPECS}))
          "

      - name: Spend cap is hard — reservation bounds, samples, and failed-attempt cost
        run: |
          uv run python -c "
          from evalops.experiments import SpendMeter, BudgetExceeded, worst_case_call_usd
          from evalops.judge import JudgeConfig
          # A price-derived bound absorbs a call the flat estimate would have let through.
          cfg = JudgeConfig(variant_id='v', model='gpt-4.1', max_tokens=2000)
          bound = worst_case_call_usd('gpt-4.1', cfg)
          assert bound > 0.05, bound
          m = SpendMeter(cap_usd=1.0)
          m.reserve(max_attempts=1, worst_case_usd=bound).record(0.04, model='gpt-4.1')
          assert not m.as_dict()['cap_exceeded'] and m.as_dict()['reservation_breaches'] == 0
          # An over-reservation cost is committed AND reported, never hidden.
          m2 = SpendMeter(cap_usd=0.03, reserve_usd=0.01)
          m2.reserve(max_attempts=1).record(0.04, model='gpt-4o-mini')
          d = m2.as_dict()
          assert d['cap_exceeded'] and d['reservation_breaches'] == 1, d
          # samples multiply.
          c3 = JudgeConfig(variant_id='v', model='gpt-4.1-mini', samples=3, max_attempts=3, max_tokens=2000)
          b3 = worst_case_call_usd(c3.model, c3)
          m3 = SpendMeter(cap_usd=b3 * 3)
          try:
              m3.reserve(max_attempts=3, samples=3, worst_case_usd=b3)
              raise AssertionError('a nine-call judgment was admitted by a three-call budget')
          except BudgetExceeded:
              pass
          # Failed attempts still cost.
          m4 = SpendMeter(cap_usd=1.0)
          m4.reserve(max_attempts=3, worst_case_usd=0.02).release(accrued_usd=0.0042, model='gpt-4o-mini')
          assert abs(m4.spent_usd - 0.0042) < 1e-12, m4.spent_usd
          print('spend cap behaviours verified')
          "

      - name: Legacy config_hash is identified, never promoted
        run: |
          uv run python -c "
          import json, pathlib
          from evalops.judge import JudgeConfig
          p = pathlib.Path('routebench/evalops/data/dev_experiments.json')
          saved = {s['config']['variant_id']: s['config']
                   for s in json.loads(p.read_text())['run_summaries']}
          assert saved, 'no stored configs in the dev record'
          for variant, cfg in sorted(saved.items()):
              c = JudgeConfig.from_dict(cfg)
              assert c.legacy_config_hash == cfg['config_hash'], variant
              assert c.config_hash != cfg['config_hash'], variant
          print(f'{len(saved)} recorded variants reproduce under the legacy formula and not the current one')
          "

      - name: Validate the frozen calibration artifact
        run: uv run python -m evalops.calibrate routebench/evalops/data/calibration_bundle.json

      - name: Negative gate cases — the gate must actually reject
        run: |
          uv run python -c "
          import json, pathlib, tempfile
          from evalops.calibrate import validate_bundle
          src = json.loads(pathlib.Path('routebench/evalops/data/calibration_bundle.json').read_text())
          ok, _ = validate_bundle('routebench/evalops/data/calibration_bundle.json')
          assert ok, 'the committed artifact should pass'
          d = pathlib.Path(tempfile.mkdtemp())
          def check(name, mutate):
              payload = json.loads(json.dumps(src)); mutate(payload)
              p = d / f'{name}.json'; p.write_text(json.dumps(payload))
              ok, reasons = validate_bundle(p)
              assert not ok, f'{name} should have been rejected'
              print(f'  rejected {name}: {reasons[0][:90]}')
          check('unmeasured', lambda p: p.update(test_result=None))
          check('rubric_drift', lambda p: p.update(rubric_bundle_hash='stale000'))
          # bundle_id is a hash over the identity fields. Before the gate recomputed it, every one
          # of these hand-edits passed: the id was ornamental.
          check('threshold_edited', lambda p: p.update(threshold=0.05))
          check('variant_swapped', lambda p: p.update(variant_id='some-other-judge'))
          check('dataset_hash_edited', lambda p: p.update(dataset_hash='an-easier-corpus'))
          check('judge_config_edited', lambda p: p.update(judge_config={'model': 'swapped'}))
          check('labels_edited', lambda p: p.update(annotations_hash='relabelled'))
          check('split_moved', lambda p: p.update(split_membership_hash='cases-moved'))
          def below(p):
              for t in p['test_result']['tracks'].values():
                  t['kappa'] = 0.10
          check('kappa_below_policy', below)
          def undef(p):
              for t in p['test_result']['tracks'].values():
                  t['kappa'] = None; t['defined'] = False
          check('kappa_undefined', undef)
          def incomplete(p):
              p['test_result']['completion'] = {'paired': 10, 'unjudged': 90, 'completion_rate': 0.10, 'judge_errors': {}}
          check('incomplete_coverage', incomplete)
          # The corpus binding: an artifact whose kappa was measured on different data must not
          # back a routing decision, even though its rubric hash still matches.
          ok, reasons = validate_bundle(
              'routebench/evalops/data/calibration_bundle.json',
              expected_dataset_hash='a-different-corpus',
          )
          assert not ok and any('dataset hash mismatch' in r for r in reasons), reasons
          print('  rejected dataset binding mismatch')
          print('all negative cases rejected')
          "

      - name: Print the measured matrix
        run: uv run python -m evalops.bench

      - name: Preserve calibration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routebench-calibration
          path: |
            routebench/evalops/data/calibration_bundle.json
            routebench/evalops/data/calibration_report.json
            routebench/evalops/data/dev_experiments.json
            routebench/evalops/data/combiner_probe.json
            routebench/evalops/data/COMBINER_PROBE.md
          if-no-files-found: warn
