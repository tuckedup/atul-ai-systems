# Deterministic degraded-mode gate: no Docker service and no live model key.
name: eval-gate

on:
  pull_request:
    paths:
      - "forgecode/**"
      - "packages/core/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forgebench-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked workspace
        run: uv sync --frozen
      - name: Verify ForgeCode and trace miner
        run: uv run pytest forgecode/tests -q --basetemp .local/pytest-ci
      - name: Run deterministic 100-case candidate
        run: uv run python forgecode/forgebench/run.py --output .local/forgebench-candidate.json
      - name: Block success-rate drops greater than two points
        run: >-
          uv run aisys evals-compare
          forgecode/forgebench/baseline.json
          .local/forgebench-candidate.json
          --max-drop 0.02
      - name: Preserve candidate metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgebench-candidate
          path: .local/forgebench-candidate.json
          if-no-files-found: warn
