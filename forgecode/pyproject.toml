[project]
name = "forgecode"
version = "0.1.0"
description = "ForgeCode autonomous coding agent"
requires-python = ">=3.11"
dependencies = [
  "aisys-core",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=3.0",
]

[tool.uv.sources]
aisys-core = { path = "../packages/core", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["forgecode"]
